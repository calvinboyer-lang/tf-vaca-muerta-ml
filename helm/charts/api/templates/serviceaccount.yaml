{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  {{- with .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    # Workload Identity: este ServiceAccount de Kubernetes actúa como la
    # cuenta de servicio de GCP indicada. Sin llaves JSON en el cluster.
    iam.gke.io/gcp-service-account: {{ . }}
  {{- end }}
{{- end }}
