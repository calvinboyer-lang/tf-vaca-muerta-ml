apiVersion: v1
kind: Service
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    app: {{ include "api.fullname" . }}
    # Etiqueta fija que selecciona el ServiceMonitor (observability/).
    app.kubernetes.io/name: api
spec:
  selector:
    app: {{ include "api.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
